if (!S.barrios.length) S.barrios = [...zonasActivas];
S.mostrar = 60;

const banda = (a) => !a.precio || a.precio < C.precio_min || a.precio > C.precio_max ? 'fuera' : a.precio <= C.precio_objetivo_max ? 'obj' : 'est';
function pasa(a, ignorar) {
  if (!a.activo && !S.extra.includes('despublicados')) return false;
  if (ignorar !== 'barrios' && !S.barrios.includes(a.zona)) return false;
  if (tiposDisponibles.includes(a.tipoNombre)) return false; // tipos apagados en la configuración
  if (S.tipo !== 'Todos' && a.tipoNombre !== S.tipo) return false;
  if (S.portal !== 'Todos' && a.portal_nombre !== S.portal) return false;
  if (S.rango === 'rango' && banda(a) === 'fuera') return false;
  if (S.rango === 'obj' && banda(a) !== 'obj') return false;
  if (S.rango === 'est' && banda(a) !== 'est') return false;
  if (S.extra.includes('reforma') && !a.reforma) return false;
  if (S.extra.includes('baja') && !(a.var < 0)) return false;
  if (S.extra.includes('fotos') && !a.fotos.length) return false;
  if (S.extra.includes('sin-estrenar') && a.estrenar) return false;
  if (S.extra.includes('oportunidad') && !a.oportunidad) return false;
  if (S.extra.includes('viejos') && !(a.dias >= 90)) return false;
  if (S.amb && !(a.ambientes >= S.amb)) return false;
  if (S.dorm && !(a.dormitorios >= S.dorm)) return false;
  if (S.m2 && !(a.m2 >= S.m2)) return false;
  if (S.anios !== 'todos') {
    const [desde, hasta] = ANIOS[S.anios];
    if (a.anios == null || a.anios < desde || a.anios > hasta) return false;
  }
  for (const c of S.con) if (!CON[c].test(a.textoTodo)) return false;
  if (S.coleccion === 'favoritos' && !esFav(a)) return false;
  if (S.coleccion === 'descartados' ? !esDesc(a) : esDesc(a)) return false;
  const t = S.texto.trim().toLowerCase();
  if (t && !`${a.direccion} ${a.barrio} ${a.titulo} ${a.detalle} ${a.inmobiliaria}`.toLowerCase().includes(t)) return false;
  return true;
}
// Antigüedad del edificio (sólo entran los avisos que la informan)
const ANIOS = { 'nuevo': [0, 10], 'medio': [11, 30], 'viejo': [31, 50], 'muy-viejo': [51, 200] };
const CON = {
  'Pileta': /pileta|piscina|pool/, 'Cochera': /cochera|garage|garaje|coch\./, 'Jardín o patio': /jard[ií]n|patio|parque/,
  'Terraza': /terraza|azotea|solarium/, 'Parrilla': /parrilla|quincho/, 'Lote propio': /lote propio|terreno propio|sin expensas/,
  'Apto crédito': /apto cr[eé]dito/,
};
// Con "unificar", queda una tarjeta por propiedad: la más barata (y con más fotos si empatan).
function unificar(lista) {
  if (!S.extra.includes('unificar')) return lista;
  const elegido = {};
  for (const a of lista) {
    const e = elegido[a.grupo];
    if (!e || (a.precio ?? 9e9) < (e.precio ?? 9e9) || (a.precio === e.precio && a.fotos.length > e.fotos.length)) elegido[a.grupo] = a;
  }
  return lista.filter((a) => elegido[a.grupo] === a);
}
const ORDENES = {
  'precio-asc': ['Precio ↑', (a, b) => (a.precio ?? 9e9) - (b.precio ?? 9e9)],
  'precio-desc': ['Precio ↓', (a, b) => (b.precio ?? 0) - (a.precio ?? 0)],
  'm2-desc': ['m² ↓', (a, b) => (b.m2 ?? 0) - (a.m2 ?? 0)],
  'usdm2-asc': ['USD/m² ↑', (a, b) => (a.usdm2 ?? 9e9) - (b.usdm2 ?? 9e9)],
  'baja': ['Mayor baja', (a, b) => a.var - b.var],
  'recientes': ['Más nuevos', (a, b) => (b.primera_vez || '').localeCompare(a.primera_vez || '')],
  'vistas': ['Más vistos', (a, b) => (b.vistas ?? -1) - (a.vistas ?? -1)],
  'oportunidad': ['Más baratos por m² vs. su barrio', (a, b) => (a.dif ?? 9) - (b.dif ?? 9)],
  'antiguedad': ['Más tiempo publicados', (a, b) => (b.dias ?? -1) - (a.dias ?? -1)],
};

// ── piezas
function chips(label, opciones, actual, accion, multi) {
  return `<div class="fila-chips"><label>${label}</label>` + opciones.map(([v, t, n]) => {
    const on = multi ? actual.includes(v) : String(actual) === String(v);
    return `<button class="chip ${on ? 'on' : ''}" data-a="${accion}" data-v="${esc(v)}">${esc(t)}${n != null ? `<span class="n">${n}</span>` : ''}</button>`;
  }).join('') + '</div>';
}
function foto(a, cls = '') {
  const u = a.fotos[0];
  return u ? `<img loading="lazy" referrerpolicy="no-referrer" src="${esc(u)}" alt="" onerror="this.remove()">` : '<div class="sin">Sin foto</div>';
}
function badges(a) {
  let b = `<span class="b">${a.tipoNombre}</span><span class="b">${esc(a.zona || '')}</span>`;
  const evs = evPorK[a.k] || [];
  if (a.var < 0) b += `<span class="b baja">Bajó ${(a.var * 100).toFixed(0)}%</span>`;
  else if (a.var > 0) b += `<span class="b suba">Subió ${(a.var * 100).toFixed(0)}%</span>`;
  if (evs.some((e) => e.tipo === 'nuevo')) b += '<span class="b nuevo">Nuevo</span>';
  if (a.oportunidad) b += `<span class="b opo">m² ${Math.round(a.dif * 100)}% vs. barrio</span>`;
  if (a.dias >= 90) b += `<span class="b viejo">Hace ${a.dias >= 365 ? Math.floor(a.dias / 365) + ' año' + (a.dias >= 730 ? 's' : '') : Math.round(a.dias / 30) + ' meses'}</span>`;
  if (a.reforma) b += '<span class="b ref">A reformar</span>';
  return b;
}
function tarjeta(a) {
  const nuevo = (evPorK[a.k] || []).some(nuevoParaVos);
  const feats = [a.m2 && `${a.m2} m²`, a.ambientes && `${a.ambientes} amb`, a.dormitorios && `${a.dormitorios} dorm`,
    a.anios != null && (a.anios === 0 ? 'a estrenar' : `${a.anios} años`)].filter(Boolean);
  return `<div class="card ${a.activo ? '' : 'inactivo'}" data-k="${esc(a.k)}">
    <div class="foto">${foto(a)}<div class="badges">${badges(a)}</div>
      <div class="acciones"><button class="fav ${esFav(a) ? 'on' : ''}" data-a="fav" data-v="${esc(a.k)}" title="Favorito">★</button><button class="desc ${esDesc(a) ? 'on' : ''}" data-a="desc" data-v="${esc(a.k)}" title="Descartar">✕</button></div>${a.fotos.length > 1 ? `<span class="nfotos">${a.fotos.length} fotos</span>` : ''}</div>
    <div class="cuerpo">
      <div class="precio">${nuevo ? '<span class="punto" title="Cambió desde tu última visita"></span>' : ''}${fmt(a.precio)}
        ${a.var ? `<s>${fmt(a.precio_inicial)}</s>` : ''}</div>
      <div class="dir">${esc(a.direccion || a.titulo)}</div>
      ${feats.length ? `<div class="feats">${feats.map((f) => `<span class="feat">${f}</span>`).join('')}</div>` : ''}
      ${a.tambien_en?.length ? `<div class="meta">${S.extra.includes('unificar') ? 'Publicado en ' + [a.portal_nombre, ...a.tambien_en.map((o) => o.portal)].join(', ') : 'También en ' + a.tambien_en.map((o) => o.portal).join(' y ')}</div>` : ''}
      <div class="pie"><span>${a.portal_nombre}</span>
        <span>${a.usdm2 ? `<b>${Math.round(a.usdm2).toLocaleString('es-AR')}</b> USD/m²` : ''}${a.vistas != null ? ` · ${a.vistas} vistas` : ''}</span></div>
    </div></div>`;
}

function render() {
  guardar('estado', { ...S, mostrar: undefined });
  const act = unificar(D.avisos.filter((a) => pasa(a)));
  const conPrecio = act.filter((a) => a.precio);
  const conM2 = act.filter((a) => a.usdm2);
  const prom = (xs, f) => xs.length ? xs.reduce((s, x) => s + f(x), 0) / xs.length : null;
  const nov = D.eventos.filter((e) => nuevoParaVos(e) && porK[e.portal + '|' + e.id] && pasa(porK[e.portal + '|' + e.id]));

  $('#sub').textContent = S.barrios.length === zonasActivas.length ? zonasActivas.join(', ') : S.barrios.join(', ');
  $('#fecha').innerHTML = `Actualizado<br>${esc(D.generado.slice(0, 16))}`;
  $('#kpis').innerHTML = [
    ['Activas', act.length],
    ['Precio promedio', 'USD ' + corto(prom(conPrecio, (a) => a.precio))],
    ['USD/m² promedio', conM2.length ? Math.round(prom(conM2, (a) => a.usdm2)).toLocaleString('es-AR') : '—'],
    [ultimaVisita ? 'Novedades desde tu visita' : 'Hasta ' + corto(C.precio_objetivo_max), ultimaVisita ? nov.length : act.filter((a) => banda(a) === 'obj').length],
  ].map(([t, v]) => `<div class="kpi"><span>${t}</span><b>${v}</b></div>`).join('');

  $('#tabs').innerHTML = [['avisos', 'Avisos', act.length], ['mapa', 'Mapa', null], ['novedades', 'Novedades', evVisibles.length], ['estado', 'Estado', null]]
    .map(([v, t, n]) => `<button class="${S.vista === v ? 'on' : ''}" data-a="vista" data-v="${v}">${t}${n != null ? `<span class="cnt">${n}</span>` : ''}</button>`).join('');

  const cuenta = (f) => unificar(D.avisos.filter((a) => pasa(a, 'barrios'))).filter(f).length;
  const portales = [...new Set(D.avisos.map((a) => a.portal_nombre))];
  $('#filtros').innerHTML = S.vista === 'estado' ? '' :
    chips('Barrio', [['__todos', 'Todos'], ...zonasActivas.map((z) => [z, z, cuenta((a) => a.zona === z)]).filter((x) => x[2] > 0 || !D.zonas.some((z) => (z.sub || []).includes(x[0])))],
      S.barrios.length === zonasActivas.length ? ['__todos', ...S.barrios] : S.barrios, 'barrio', true) +
    chips('Tipo', [['Todos', 'Todos'], ...tiposActivos.map((t) => [t, t, cuenta((a) => a.tipoNombre === t)])], S.tipo, 'tipo') +
    chips('Precio', [['rango', corto(C.precio_min) + ' a ' + corto(C.precio_max)], ['obj', 'Hasta ' + corto(C.precio_objetivo_max)], ['est', corto(C.precio_objetivo_max) + ' a ' + corto(C.precio_max)], ['Todos', 'Todos, también fuera de rango']], S.rango, 'rango') +
    `<button class="chip toggle-filtros" data-a="mas-filtros">${$('#filtros').classList.contains('abierto') ? 'Menos filtros' : 'Más filtros y orden'}</button>` +
    `<div class="extra-fila">` + chips('Portal', [['Todos', 'Todos'], ...portales.map((p) => [p, p])], S.portal, 'portal') + `</div><div>` +
    chips('Ver', [['todos', 'Todos'], ['favoritos', `★ Favoritos`, new Set(D.avisos.filter((a) => a.activo && esFav(a)).map((a) => a.grupo)).size], ['descartados', 'Descartados', new Set(D.avisos.filter((a) => a.activo && esDesc(a)).map((a) => a.grupo)).size]], S.coleccion, 'coleccion').replace(/<\/div>$/, '<button class="chip" data-a="sync">⇄ Pasar favoritos a otro dispositivo</button></div>') + `</div><div class="extra-fila">` +
    chips('Mostrar', [['oportunidad', 'Oportunidades'], ['baja', 'Bajaron de precio'], ['viejos', 'Publicados hace +90 días'], ['reforma', 'A reformar'],
      ['unificar', 'Un aviso por propiedad'], ['sin-estrenar', 'Ocultar a estrenar y en pozo'], ['fotos', 'Con fotos'], ['despublicados', 'Despublicados']], S.extra, 'extra', true) + `</div><div class="extra-fila">` +
    chips('Ambientes', [[0, 'Todos'], [3, '3+'], [4, '4+'], [5, '5+']], S.amb, 'amb') + `</div><div class="extra-fila">` +
    chips('Dormitorios', [[0, 'Todos'], [2, '2+'], [3, '3+'], [4, '4+']], S.dorm, 'dorm') + `</div><div class="extra-fila">` +
    chips('m² totales', [[0, 'Todos'], [100, '100+'], [150, '150+'], [200, '200+'], [300, '300+']], S.m2, 'm2') + `</div><div class="extra-fila">` +
    chips('Antigüedad', [['todos', 'Todas'], ['nuevo', 'Hasta 10 años'], ['medio', '11 a 30'], ['viejo', '31 a 50'], ['muy-viejo', 'Más de 50'],
      ].map(([v, t]) => [v, t, v === 'todos' ? null : cuenta((a) => a.anios != null && a.anios >= ANIOS[v][0] && a.anios <= ANIOS[v][1])]), S.anios, 'anios') + `</div><div class="extra-fila">` +
    chips('Con', Object.keys(CON).map((c) => [c, c]), S.con, 'con', true) + `</div><div class="extra-fila">` +
    (S.vista === 'avisos' ? chips('Ordenar', Object.entries(ORDENES).map(([k, [t]]) => [k, t]), S.orden, 'orden') : '') + `</div>` +
    `<div class="fila-chips extra-fila"><label>Buscar</label><input class="buscar" id="buscar" placeholder="Calle, inmobiliaria, palabra…" value="${esc(S.texto)}"></div>`;

  if (S.vista === 'avisos') {
    act.sort(ORDENES[S.orden][1]);
    $('#main').innerHTML = act.length
      ? `<div class="grid">${act.slice(0, S.mostrar).map(tarjeta).join('')}</div>` +
        (act.length > S.mostrar ? `<button class="chip mas" data-a="mas">Ver más (${act.length - S.mostrar})</button>` : '')
      : '<div class="vacio">No hay avisos con estos filtros.</div>';
  } else if (S.vista === 'mapa') {
    pintarMapa(act);
  } else if (S.vista === 'novedades') {
    $('#main').innerHTML = evVisibles.length ? evVisibles.slice(0, 300).map(novedad).join('')
      : '<div class="vacio">Todavía no hay novedades. Aparecen a partir de la segunda corrida.</div>';
  } else {
    const nombre = { argenprop: 'Argenprop', zonaprop: 'Zonaprop', mercadolibre: 'MercadoLibre' };
    $('#main').innerHTML = '<table><tr><th>Fecha</th><th>Portal</th><th>Resultado</th><th>Avisos</th><th>Nota</th></tr>' +
      D.corridas.map((c) => `<tr><td>${esc(c.fecha.slice(0, 16))}</td><td>${nombre[c.portal] || esc(c.portal)}</td><td style="color:var(--${c.ok ? 'baja' : 'suba'})">${c.ok ? 'OK' : 'Error'}</td><td>${c.avisos}</td><td>${esc(c.nota)}</td></tr>`).join('') + '</table>';
  }
  const sumar = [zonasDisponibles.length && `barrios ${zonasDisponibles.map(esc).join(', ')}`, tiposDisponibles.length && `tipos ${tiposDisponibles.map(esc).join(', ')}`].filter(Boolean);
  $('#nota').innerHTML = sumar.length ? `Listos para sumar al monitor: ${sumar.join('; ')}. Pedíselo a Claude o cambiá <code>false</code> por <code>true</code> en config.json.` : '';
  const b = $('#buscar');
  if (b) b.oninput = (e) => { S.texto = e.target.value; clearTimeout(b._t); b._t = setTimeout(() => { render(); const n = $('#buscar'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
}

// ── mapa
let MAPA = null;
const colorDe = (a) => a.var < 0 ? '#3ecf8e' : (evPorK[a.k] || []).some((e) => e.tipo === 'nuevo') ? '#5b9cf5' : a.var > 0 ? '#f2705b' : '#c9ced8';
function pintarMapa(lista) {
  const con = lista.filter((a) => a.lat && a.lng);
  const sin = lista.length - con.length;
  $('#main').innerHTML = `<div class="leyenda"><span><i style="background:#3ecf8e"></i>Bajó de precio</span><span><i style="background:#5b9cf5"></i>Nuevo</span>
    <span><i style="background:#f2705b"></i>Subió</span><span><i style="background:#c9ced8"></i>Sin cambios</span>
    <span>${con.length} en el mapa${sin ? ` · ${sin} todavía sin ubicación` : ''}</span></div><div id="mapa"></div>`;
  if (MAPA) { MAPA.remove(); MAPA = null; }
  if (typeof L === 'undefined') { $('#mapa').innerHTML = '<div class="vacio">No se pudo cargar el mapa. Revisá la conexión y recargá.</div>'; return; }
  MAPA = L.map('mapa', { scrollWheelZoom: true });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap &copy; CARTO' }).addTo(MAPA);
  const pts = [];
  for (const a of con) {
    pts.push([a.lat, a.lng]);
    L.circleMarker([a.lat, a.lng], { radius: 7, color: '#0f1218', weight: 1.5, fillColor: colorDe(a), fillOpacity: .95 })
      .bindPopup(`<div class="pop">${a.fotos[0] ? `<img referrerpolicy="no-referrer" src="${esc(a.fotos[0])}" onerror="this.remove()">` : ''}
        <div class="p">${fmt(a.precio)}${a.var ? ` <span class="var ${a.var < 0 ? 'baja' : 'suba'}">${(a.var * 100).toFixed(0)}%</span>` : ''}</div>
        <div class="dir">${esc(a.direccion || a.titulo)}</div>
        <div class="meta">${a.tipoNombre}${a.m2 ? ' · ' + a.m2 + ' m²' : ''} · ${a.portal_nombre}</div>
        <button class="chip" data-k="${esc(a.k)}">Ver fotos y detalle</button></div>`)
      .addTo(MAPA);
  }
  if (pts.length) MAPA.fitBounds(pts, { padding: [30, 30], maxZoom: 15 });
  else MAPA.setView([-34.52, -58.48], 13);
}

const NOMBRE_EV = { nuevo: 'Nuevo', baja: 'Bajó', suba: 'Subió', vistas: 'Más vistas', despublicado: 'Despublicado', reaparecio: 'Volvió' };
function novedad(e) {
  const a = porK[e.portal + '|' + e.id];
  let c = '';
  if (e.tipo === 'baja' || e.tipo === 'suba') c = `${fmt(e.antes)} → <b>${fmt(e.despues)}</b> <span class="var ${e.tipo}">${((e.despues - e.antes) / e.antes * 100).toFixed(1)}%</span>`;
  else if (e.tipo === 'vistas') c = `${e.antes} → <b>${e.despues}</b> vistas`;
  else if (e.tipo === 'despublicado') c = `último precio ${fmt(e.antes)}`;
  else c = `<b>${fmt(e.despues)}</b>${e.texto ? ' · ' + esc(e.texto) : ''}`;
  return `<div class="ev" data-k="${esc(a.k)}"><div class="mini">${a.fotos[0] ? `<img loading="lazy" referrerpolicy="no-referrer" src="${esc(a.fotos[0])}" onerror="this.remove()">` : ''}</div>
    <div><div class="que" style="color:var(--${e.tipo === 'baja' ? 'baja' : e.tipo === 'suba' || e.tipo === 'despublicado' ? 'suba' : 'acc'})">${nuevoParaVos(e) ? '<span class="punto"></span>' : ''}${NOMBRE_EV[e.tipo] || e.tipo}</div>
      <div class="dir">${esc(a.direccion || a.titulo)}</div><div class="cuando">${esc(a.zona || '')} · ${a.portal_nombre} · ${esc(e.fecha.slice(0, 16))}</div></div>
    <div>${c}</div></div>`;
}

// ── detalle con galería
let G = { a: null, i: 0 };
function grafico(serie, titulo, esPrecio) {
  if (!serie || serie.length < 2) return '';
  const W = 380, H = 80, P = 6, v = serie.map((s) => s[1]), mn = Math.min(...v), mx = Math.max(...v);
  const x = (i) => P + i * (W - 2 * P) / (serie.length - 1), y = (n) => mx === mn ? H / 2 : H - P - (n - mn) / (mx - mn) * (H - 2 * P - 12);
  const l = (n) => esPrecio ? fmt(n) : n;
  return `<div class="graf"><div class="t">${titulo}: ${l(serie[0][1])} → ${l(serie.at(-1)[1])}</div><svg width="100%" viewBox="0 0 ${W} ${H}">
    <polyline points="${serie.map((s, i) => `${x(i)},${y(s[1])}`).join(' ')}" fill="none" stroke="currentColor" stroke-width="2"/>
    ${serie.map((s, i) => `<circle cx="${x(i)}" cy="${y(s[1])}" r="3" fill="currentColor"><title>${s[0]}: ${l(s[1])}</title></circle>`).join('')}</svg></div>`;
}
function abrir(k) {
  const a = porK[k]; if (!a) return;
  G = { a, i: 0 };
  pintarDetalle();
  $('#modal').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function pintarDetalle() {
  const a = G.a, f = a.fotos, i = G.i;
  const grande = (u) => u.replace('_u_small', '_u_large').replace('/360x266/', '/720x532/');
  const evs = (evPorK[a.k] || []).map((e) => `<div class="meta">${esc(e.fecha.slice(0, 10))} · ${NOMBRE_EV[e.tipo] || e.tipo}${e.antes && e.despues ? `: ${fmt(e.antes)} → ${fmt(e.despues)}` : ''}</div>`).join('');
  $('#caja').innerHTML = `<button class="cerrar" data-a="cerrar">×</button>
    ${f.length ? `<div class="galeria"><img referrerpolicy="no-referrer" src="${esc(grande(f[i]))}" onerror="this.src='${esc(f[i])}'">
      ${f.length > 1 ? `<button class="flecha izq" data-a="foto" data-v="-1">‹</button><button class="flecha der" data-a="foto" data-v="1">›</button><span class="num">${i + 1} / ${f.length}</span>` : ''}</div>
      ${f.length > 1 ? `<div class="tiras">${f.map((u, j) => `<img referrerpolicy="no-referrer" loading="lazy" class="${j === i ? 'on' : ''}" src="${esc(u)}" data-a="ir" data-v="${j}">`).join('')}</div>` : ''}` : ''}
    <div class="info"><div>
      <h2>${fmt(a.precio)} ${a.var ? `<span class="var ${a.var < 0 ? 'baja' : 'suba'}">${(a.var * 100).toFixed(1)}%</span>` : ''}</h2>
      <div class="dir">${esc(a.direccion || '')}</div>
      <div class="meta">${a.tipoNombre} · ${esc(a.zona || '')} · ${a.portal_nombre}${a.inmobiliaria ? ' · ' + esc(a.inmobiliaria) : ''}</div>
      <p>${esc(a.titulo || '')}</p>
      <div class="feats">${[a.m2 && a.m2 + ' m²', a.ambientes && a.ambientes + ' amb', a.dormitorios && a.dormitorios + ' dorm', a.usdm2 && Math.round(a.usdm2).toLocaleString('es-AR') + ' USD/m²'].filter(Boolean).map((x) => `<span class="feat">${x}</span>`).join('')}</div>
      <div class="meta" style="margin-top:8px">${esc(a.detalle || '')}</div>
      ${a.oportunidad ? `<div class="meta" style="margin-top:8px;color:var(--baja)">USD/m² ${Math.round(a.dif * -100)}% por debajo de la mediana de ${esc(a.tipoNombre)} en ${esc(a.zona)} (${Math.round(a.refM2).toLocaleString('es-AR')} USD/m²)</div>` : ''}
      ${a.miembros.length > 1 ? `<div class="portales"><div class="meta">Publicado en ${a.miembros.length} avisos:</div>${a.miembros.map((o) => `<a href="${esc(o.url)}" target="_blank" rel="noopener">${o.portal_nombre}: ${fmt(o.precio)}${o.inmobiliaria ? ' · ' + esc(o.inmobiliaria) : ''} ↗</a>`).join('')}</div>`
        : `<a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener">Ver en ${a.portal_nombre} ↗</a>`}
      <div style="margin-top:12px;display:flex;gap:8px"><button class="chip ${esFav(a) ? 'on' : ''}" data-a="fav" data-v="${esc(a.k)}">★ ${esFav(a) ? 'En favoritos' : 'Favorito'}</button>
        <button class="chip ${esDesc(a) ? 'on' : ''}" data-a="desc" data-v="${esc(a.k)}">✕ ${esDesc(a) ? 'Descartado' : 'Descartar'}</button></div>
    </div><div>
      <div class="meta">Publicado a ${fmt(a.precio_inicial)}${a.dias != null ? ` · hace ${a.dias} días` : ''} · lo sigo desde ${esc((a.primera_vez || '').slice(0, 10))}${a.antiguedad ? ' · ' + esc(a.antiguedad) : ''}${a.vistas != null ? ' · ' + a.vistas + ' visualizaciones' : ''}</div>
      ${grafico(D.precios[a.k], 'Precio', true)}${grafico(D.vistas[a.k], 'Visualizaciones', false)}
      ${evs ? `<div style="margin-top:10px">${evs}</div>` : ''}
    </div></div>`;
}
function cerrar() { $('#modal').classList.remove('on'); document.body.style.overflow = ''; }

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (el) {
    const a = el.dataset.a, v = el.dataset.v;
    if (a === 'vista') { S.vista = v; S.mostrar = 60; }
    else if (a === 'barrio') {
      if (v === '__todos') S.barrios = S.barrios.length === zonasActivas.length ? [] : [...zonasActivas];
      else if (S.barrios.length === zonasActivas.length) S.barrios = [v];
      else S.barrios = S.barrios.includes(v) ? S.barrios.filter((b) => b !== v) : [...S.barrios, v];
      if (!S.barrios.length) S.barrios = v === '__todos' ? [...zonasActivas] : [v];
    }
    else if (a === 'tipo') S.tipo = v; else if (a === 'portal') S.portal = v; else if (a === 'rango') S.rango = v;
    else if (a === 'orden') S.orden = v;
    else if (a === 'amb' || a === 'dorm' || a === 'm2') S[a] = +v;
    else if (a === 'con') S.con = S.con.includes(v) ? S.con.filter((x) => x !== v) : [...S.con, v];
    else if (a === 'coleccion') S.coleccion = v;
    else if (a === 'anios') S.anios = v;
    else if (a === 'fav' || a === 'desc') {
      const set = a === 'fav' ? FAV : DESC, otro = a === 'fav' ? DESC : FAV;
      const miembros = (porK[v]?.miembros || [porK[v]]).map((o) => o.k);
      const estaba = miembros.some((k) => set.has(k));
      for (const k of miembros) { estaba ? set.delete(k) : set.add(k); if (!estaba) otro.delete(k); }
      guardar('favoritos', [...FAV]); guardar('descartados', [...DESC]);
      if ($('#modal').classList.contains('on')) pintarDetalle();
      return render();
    }
    else if (a === 'extra') S.extra = S.extra.includes(v) ? S.extra.filter((x) => x !== v) : [...S.extra, v];
    else if (a === 'mas') { S.mostrar += 60; }
    else if (a === 'cerrar') return cerrar();
    else if (a === 'sync') { compartirFavoritos(); return; }
    else if (a === 'mas-filtros') { $('#filtros').classList.toggle('abierto'); return render(); }
    else if (a === 'foto') { G.i = (G.i + +v + G.a.fotos.length) % G.a.fotos.length; return pintarDetalle(); }
    else if (a === 'ir') { G.i = +v; return pintarDetalle(); }
    if (a !== 'mas' && a !== 'vista') S.mostrar = 60;
    return render();
  }
  const card = e.target.closest('[data-k]');
  if (card && !e.target.closest('a')) return abrir(card.dataset.k);
  if (e.target.id === 'modal') cerrar();
});
document.addEventListener('keydown', (e) => {
  if (!$('#modal').classList.contains('on')) return;
  if (e.key === 'Escape') cerrar();
  if (G.a && G.a.fotos.length > 1 && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { G.i = (G.i + (e.key === 'ArrowRight' ? 1 : -1) + G.a.fotos.length) % G.a.fotos.length; pintarDetalle(); }
});
const ultimas = {}; for (const c of D.corridas) if (!(c.portal in ultimas)) ultimas[c.portal] = c;
const caidos = Object.values(ultimas).filter((c) => !c.ok);
if (caidos.length) $('#alertas').innerHTML = caidos.map((c) => `<div class="aviso">No se pudo leer ${esc(c.portal)} en la última corrida (${esc(c.fecha.slice(0, 16))}): ${esc(c.nota)}</div>`).join('');
render();
if (avisoSync) alertaBreve(avisoSync);
</script>
</body>
